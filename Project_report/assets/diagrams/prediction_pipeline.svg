<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4037"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E76F51"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#737A74"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#252B28"/></marker>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1F4037" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1700" height="900" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="850.0" y="46" font-size="36" font-weight="700" fill="#1F4037" text-anchor="middle">Placement Prediction Pipeline</text>
<text x="850.0" y="78" font-size="19" font-weight="400" fill="#737A74" text-anchor="middle">From stored profile to an explainable probability, risk band and advice</text>
<line x1="70" y1="98" x2="1630" y2="98" stroke="#D8D8CF" stroke-width="1.5"/>
<text x="1630" y="882" font-size="14" font-weight="400" fill="#737A74" text-anchor="end">Placement Prediction System  |  Project Report</text>
<rect x="60" y="165" width="250" height="215" rx="12" fill="#FFFFFF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="185.0" y="196" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Student profile</text>
<line x1="74" y1="210" x2="296" y2="210" stroke="#1F4037" stroke-width="1"/>
<text x="78" y="239" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">cgpa</text>
<text x="78" y="263" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">backlogs</text>
<text x="78" y="287" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">projects_count</text>
<text x="78" y="311" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">internships_count</text>
<text x="78" y="335" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">certifications_count</text>
<text x="78" y="359" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">skills_count</text>
<rect x="360" y="165" width="250" height="215" rx="12" fill="#FFFFFF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="485.0" y="196" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Feature vector</text>
<line x1="374" y1="210" x2="596" y2="210" stroke="#1F4037" stroke-width="1"/>
<text x="378" y="239" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">x = [6 numeric values]</text>
<text x="378" y="263" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">skills counted from</text>
<text x="378" y="287" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">student_skills</text>
<rect x="660" y="165" width="250" height="215" rx="12" fill="#FFFFFF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="785.0" y="196" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Standardisation</text>
<line x1="674" y1="210" x2="896" y2="210" stroke="#1F4037" stroke-width="1"/>
<text x="678" y="239" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">z_i = (x_i − μ_i) / σ_i</text>
<text x="678" y="263" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">μ and σ loaded from</text>
<text x="678" y="287" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">model.json</text>
<rect x="960" y="165" width="300" height="215" rx="12" fill="#FFFFFF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1110.0" y="196" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Logistic regression</text>
<line x1="974" y1="210" x2="1246" y2="210" stroke="#1F4037" stroke-width="1"/>
<text x="978" y="239" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">z = b + Σ w_i z_i</text>
<text x="978" y="263" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">weights from training</text>
<text x="978" y="287" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">L2 regularised</text>
<rect x="1310" y="165" width="280" height="215" rx="12" fill="#FFFFFF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1450.0" y="196" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Sigmoid output</text>
<line x1="1324" y1="210" x2="1576" y2="210" stroke="#1F4037" stroke-width="1"/>
<text x="1328" y="239" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">p = 1 / (1 + e^(−z))</text>
<text x="1328" y="263" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">0 ≤ p ≤ 1</text>
<text x="1328" y="287" font-size="16" font-weight="400" fill="#252B28" text-anchor="start">probability</text>
<line x1="310" y1="272" x2="360" y2="272" stroke="#1F4037" stroke-width="2.8" marker-end="url(#arrow-green)"/>
<line x1="610" y1="272" x2="660" y2="272" stroke="#1F4037" stroke-width="2.8" marker-end="url(#arrow-green)"/>
<line x1="910" y1="272" x2="960" y2="272" stroke="#1F4037" stroke-width="2.8" marker-end="url(#arrow-green)"/>
<line x1="1260" y1="272" x2="1310" y2="272" stroke="#1F4037" stroke-width="2.8" marker-end="url(#arrow-green)"/>
<rect x="430" y="515" width="470" height="155" rx="16" fill="#F4F2EA" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="665" y="550" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Result presentation</text>
<text x="452" y="580" font-size="15" font-weight="400" fill="#252B28" text-anchor="start">gauge: placement chance %</text>
<text x="452" y="603" font-size="15" font-weight="400" fill="#252B28" text-anchor="start">factor bars: positive / negative</text>
<text x="452" y="626" font-size="15" font-weight="400" fill="#252B28" text-anchor="start">advice list + history chart</text>
<rect x="960" y="515" width="300" height="155" rx="16" fill="#EEF3EF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1110" y="550" font-size="20" font-weight="700" fill="#1F4037" text-anchor="middle">Explainability</text>
<text x="982" y="580" font-size="15" font-weight="400" fill="#252B28" text-anchor="start">contribution_i = w_i · z_i</text>
<text x="982" y="603" font-size="15" font-weight="400" fill="#252B28" text-anchor="start">rank features by impact</text>
<text x="982" y="626" font-size="15" font-weight="400" fill="#252B28" text-anchor="start">personalised advice</text>
<rect x="1310" y="515" width="280" height="155" rx="16" fill="#FBEDE8" stroke="#E76F51" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1450" y="550" font-size="20" font-weight="700" fill="#E76F51" text-anchor="middle">Risk band</text>
<text x="1332" y="580" font-size="15" font-weight="500" fill="#252B28" text-anchor="start">p ≥ 70% → high</text>
<text x="1332" y="603" font-size="15" font-weight="500" fill="#252B28" text-anchor="start">40–70% → medium</text>
<text x="1332" y="626" font-size="15" font-weight="500" fill="#252B28" text-anchor="start">< 40% → low</text>
<line x1="1110" y1="380" x2="1110" y2="513" stroke="#1F4037" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="1185" y="450" font-size="13" font-weight="600" fill="#1F4037" text-anchor="middle">factor view</text>
<line x1="1450" y1="380" x2="1450" y2="513" stroke="#E76F51" stroke-width="2.2" marker-end="url(#arrow-coral)"/>
<text x="1510" y="450" font-size="13" font-weight="600" fill="#E76F51" text-anchor="middle">threshold</text>
<line x1="958" y1="592" x2="902" y2="592" stroke="#1F4037" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<path d="M 1450 670 L 1450 720 L 665 720 L 665 672" fill="none" stroke="#737A74" stroke-width="2.2" marker-end="url(#arrow-muted)"/>
<text x="1080" y="708" font-size="13" font-weight="600" fill="#737A74" text-anchor="start">display</text>
<line x1="665" y1="670" x2="665" y2="788" stroke="#1F4037" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="700" y="740" font-size="13" font-weight="600" fill="#1F4037" text-anchor="middle">render</text>
<rect x="430" y="790" width="470" height="70" rx="30" fill="#EEF3EF" stroke="#1F4037" stroke-width="1.5" filter="url(#shadow)"/>
<text x="665" y="833" font-size="19" font-weight="700" fill="#1F4037" text-anchor="middle">Student dashboard and prediction page</text>
<text x="850" y="880" font-size="14" font-weight="400" fill="#737A74" text-anchor="middle">The model loads once from model.json; each request standardises all six features using the training means and standard deviations.</text>
</svg>